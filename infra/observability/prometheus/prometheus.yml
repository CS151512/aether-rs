global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'alerts.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'aether-api'
    static_configs:
      - targets: ['api:8080']

  - job_name: 'aether-worker'
    static_configs:
      - targets: ['worker:8081']
