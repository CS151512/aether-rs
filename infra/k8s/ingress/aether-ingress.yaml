apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aether-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: aether.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: aether-api
            port:
              number: 8080
